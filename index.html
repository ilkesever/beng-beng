<style>
  :root {
    --bg: #05060d;
    --glass: rgba(14, 16, 30, .72);
    --line: rgba(255,255,255,.12);
    --text: #f2efe9;
    --muted: #9a98a8;
    --accent: #ffb547;
    --pink: #ff6b8b;
    --paper: #fbf8f2;
    --ink: #2a2424;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: "Space Grotesk", system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; touch-action: manipulation; }
  .dock { z-index: 3; }

  /* Globe büyük tutulup kaydırılıyor: odak noktası fotoğrafın yanına/altına düşsün */
  #globe { position: fixed; top: 0; left: 0; width: 140vw; height: 100vh; }
  @media (max-width: 760px) { #globe { width: 100vw; height: 156vh; } }

  .label { transform: translate(-50%, -150%); padding: 3px 9px; border-radius: 8px; background: rgba(0,0,0,.6);
           font-size: 13px; font-weight: 500; white-space: nowrap; pointer-events: none; border: 1px solid var(--line); }

  /* fotoğraf sahnesi */
  .stage { position: fixed; top: 0; left: 0; width: 58vw; height: 100vh; display: flex; align-items: center; justify-content: center;
           padding: 70px 24px 120px; pointer-events: none; perspective: 1200px; }
  @media (max-width: 760px) { .stage { width: 100vw; height: 66vh; padding: 56px 16px 12px; } }

  .card { position: absolute; background: var(--paper); color: var(--ink); padding: 12px 12px 0; border-radius: 4px;
          box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.35); pointer-events: auto;
          transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .9s; will-change: transform, opacity; }
  .card img { display: block; max-width: min(46vw, 820px); max-height: calc(100vh - 290px); width: auto; height: auto; border-radius: 2px; background: #ddd; }
  @media (max-width: 760px) { .card { padding: 8px 8px 0; } .card img { max-width: calc(100vw - 48px); max-height: calc(66vh - 150px); } }
  .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 4px 12px; }
  .city { font-family: "Caveat", cursive; font-size: 1.9rem; line-height: 1; }

  .when { font-size: .85rem; color: #8b8080; white-space: nowrap; text-align: right; }

  .card.enter { opacity: 0; }
  .card.leave { opacity: 0; pointer-events: none; }

  /* üst bar */

         padding: 16px 20px; pointer-events: none; }
  .brand { font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 500; }

  /* alt kontroller */

  .row { display: flex; align-items: center; gap: 10px; }
  .ctrl { width: 44px; height: 44px; border-radius: 50%; background: var(--glass); border: 1px solid var(--line);

  .ticks { position: absolute; left: 18px; right: 18px; top: 9px; height: 12px; display: flex; gap: 2px; }

  .tick.past { background: rgba(255,181,71,.55); }
  .tick.cur { background: var(--pink); transform: scaleY(1.5); }
  .years { position: absolute; left: 18px; right: 18px; bottom: 5px; height: 14px; font-size: 10px; color: var(--muted); }
  .years span { position: absolute; transform: translateX(-2px); }

  #player { width: 300px; height: 80px; border-radius: 12px; overflow: hidden; flex: none; }
  @media (max-width: 760px) {
    .dock { left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); }
    .row.main { order: 2; }
    #player { display: none; }
    .listen { display: inline-flex !important; }

PHOTOS.forEach((p, i) => {
  const q = PHOTOS[i - 1];
  if (q && cityKey(q) !== cityKey(p)) legs.push({ at: i, startLat: q.lat, startLng: q.lng, endLat: p.lat, endLng: p.lng });
});


// ---------- globe ----------
const globeEl = $("globe");
const world = Globe()(globeEl)
  .globeImageUrl(IMG + "earth-night.jpg")
  .bumpImageUrl(IMG + "earth-topology.png")
  .backgroundImageUrl(IMG + "night-sky.png")
  .atmosphereColor("#ff9db0")
  .atmosphereAltitude(0.18)

  .pointLat("lat").pointLng("lng")

const dist = (a, b) => Math.hypot(a.lat - b.lat, (a.lng - b.lng) * Math.cos((a.lat + b.lat) / 2 * Math.PI / 180));
let flyTimer = null;

function flyTo(p, prev) {
  clearTimeout(flyTimer);
  const near = isMobile() ? 1.1 : 0.85;
  if (!prev || cityKey(prev) === cityKey(p)) {
    world.pointOfView({ lat: p.lat, lng: p.lng, altitude: near }, 1400);
    return 1400;
  }
  const d = dist(prev, p);
  const peak = Math.min(2.8, 1.1 + d / 35);
  const t1 = Math.min(1400, 700 + d * 12), t2 = 1300;
  world.pointOfView({ lat: (prev.lat + p.lat) / 2, lng: (prev.lng + p.lng) / 2, altitude: peak }, t1);
  flyTimer = setTimeout(() => world.pointOfView({ lat: p.lat, lng: p.lng, altitude: near }, t2), t1);
  return t1 + t2;
}

  if (s.endsWith("-11-20")) return `${+s.slice(0, 4) - 2021}. yıl dönümü`;

  const sp = special(p.date);
  el.innerHTML = `<img src="${p.src}" width="${p.w}" height="${p.h}" alt="${p.city}">

    <span class="when">${sp ? `<b>${sp}</b>` : ""}${fmtDate(p.date)}</span></figcaption>`;
  return el;
}

  // yeni kart: masaya atılmış gibi düşer
  const el = makeCard(p);
  const rot = rnd(-3.5, 3.5);
  el.style.transform = `translate(${dir * 30}vw, 10vh) rotate(${dir * 18}deg) scale(.85)`;
  stage.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.classList.remove("enter");
    el.style.transform = `rotate(${rot}deg)`;
  }));
  card = el;

  // globe
  const flight = flyTo(p, prev);
  world.ringsData([p]);
  world.htmlElementsData([p]);
  world.arcsData(legs.filter(l => l.at <= i).map(l => ({ ...l, cur: l.at === i && prev && cityKey(prev) !== cityKey(p) })));
  world.controls().autoRotate = false;

  // UI
  $("num").textContent = `${String(i + 1).padStart(2, "0")} / ${PHOTOS.length}`;
  document.querySelectorAll(".tick").forEach((t, k) => { t.classList.toggle("past", k < i); t.classList.toggle("cur", k === i); });

  // sonraki fotoları önceden yükle
  [1, 2].forEach(k => { const n = PHOTOS[(i + k) % PHOTOS.length]; if (n) new Image().src = n.src; });

  scheduleNext(flight);
}

// ---------- otomatik oynatma ----------
let playing = false, nextTimer = null;
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

function scheduleNext(flight = 0) {
  clearTimeout(nextTimer);
  if (!playing) return;
  const wait = Math.max(STEP_MS, flight + 6000);
  nextTimer = setTimeout(() => show(cur + 1), wait);
}
function setPlaying(v) {
  playing = v;
  $("play").innerHTML = v ? ICON_PAUSE : ICON_PLAY;
  if (v) scheduleNext(); else clearTimeout(nextTimer);
}
setPlaying(false);

// ---------- timeline ----------
$("ticks").innerHTML = PHOTOS.map(() => '<div class="tick"></div>').join("");
$("years").innerHTML = PHOTOS.map((p, i) => [p, i]).filter(([p, i]) => i === 0 || p.date.slice(0, 4) !== PHOTOS[i - 1].date.slice(0, 4))
  .map(([p, i]) => [p, i / PHOTOS.length * 100])
  .reduce((shown, y) => (!shown.length || y[1] - shown.at(-1)[1] >= 7 ? [...shown, y] : shown), [])   // üst üste binmesin
  .map(([p, x]) => `<span style="left:${x}%">${p.date.slice(2, 4)}'</span>`).join("");

const tl = $("timeline");
function tlIndex(e) {
  const r = $("ticks").getBoundingClientRect();
  return Math.max(0, Math.min(PHOTOS.length - 1, Math.floor((e.clientX - r.left) / r.width * PHOTOS.length)));
}
let dragging = false;
tl.addEventListener("pointerdown", e => { dragging = true; tl.setPointerCapture(e.pointerId); show(tlIndex(e)); });
tl.addEventListener("pointermove", e => { if (dragging) show(tlIndex(e)); });
tl.addEventListener("pointerup", () => { dragging = false; });

// ---------- kontroller ----------
$("prev").onclick = () => show(cur - 1);
$("next").onclick = () => show(cur + 1);
$("play").onclick = () => setPlaying(!playing);
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") show(cur + 1);
  else if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
});
// kaydırma (mobil)
let sx = null;
stage.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
});
stage.addEventListener("click", e => { if (e.target.closest(".card")) show(cur + 1); });

// ---------- müzik (fotoğraflardan bağımsız) ----------
let spotify = null;
window.onSpotifyIframeApiReady = api => {
  if (isMobile()) return;   // telefonda gömülü player yok, Spotify uygulaması açılıyor
  api.createController($("player"), { uri: PLAYLIST, width: "100%", height: 80 }, c => { spotify = c; });
};

$("go").onclick = () => {
  $("start").classList.add("gone");
  spotify?.play();
  show(0);
  setPlaying(true);
};
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
